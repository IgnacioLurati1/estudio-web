    <!--
      El tema se resuelve antes de pintar nada. Si esperara a que arranque React, la
      primera pantalla saldria en claro y pasaria a oscuro medio segundo despues: un
      fogonazo blanco en la cara de alguien que justamente eligio no tener uno.
      Es la misma cuenta que hace ThemeContext, escrita para correr sin el.
    -->
    <script>
      (function () {
        try {
          // Sin cookie vale el mismo arranque que usa ThemeContext: el horario prendido, o el
          // tema del fondo que eligió el lugar (lib/look), si la vez anterior quedó guardado.
          var raw = document.cookie.split("; ").find(function (row) { return row.indexOf("tema=") === 0; });
          var surface = null;
          try { surface = (JSON.parse(localStorage.getItem("apariencia") || "null") || {}).surface; } catch (e) { /* sin almacenamiento */ }
          var fixed = surface === "oscuro" ? "dark" : surface === "claro" || surface === "calido" ? "light" : "schedule";
          var saved = raw
            ? JSON.parse(decodeURIComponent(raw.slice(5)))
            : { mode: fixed, from: "20:00", to: "07:00" };
          var theme = saved.mode;
          if (theme === "schedule") {
            var now = new Date();
            var minutes = now.getHours() * 60 + now.getMinutes();
            var toMinutes = function (time) {
              var parts = String(time).split(":");
              return Number(parts[0]) * 60 + Number(parts[1]);
            };
            var start = toMinutes(saved.from);
            var end = toMinutes(saved.to);
            var dark = start === end ? false
              : start < end ? minutes >= start && minutes < end
              : minutes >= start || minutes < end;
            theme = dark ? "dark" : "light";
          }
          if (theme === "dark" || theme === "light") document.documentElement.setAttribute("data-theme", theme);
        } catch (error) {
          /* Sin cookie, cookie rota, o cookies bloqueadas: queda el tema claro. */
        }
      })();
    </script>
    <!--
      La apariencia del consultorio —el estilo de los paneles y el color de la marca— también
      antes de pintar. La guarda lib/installation (useAppearance) la vez anterior; sin esto la
      primera pantalla sale con la letra y el verde de siempre y cambia medio segundo después.
      Es la misma cuenta que applyBrand y applyPanelSkin, escrita para correr sin React.
    -->
    <script>
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem("apariencia") || "null");
          if (!saved) return;
          var root = document.documentElement;
          if (saved.skin && saved.skin !== "base") {
            root.setAttribute("data-panel-skin", saved.skin);
            if (saved.font) {
              var link = document.createElement("link");
              link.rel = "stylesheet";
              link.href = "https://fonts.googleapis.com/css2?family=" + saved.font + "&display=swap";
              link.setAttribute("data-skin-font", saved.skin);
              document.head.appendChild(link);
            }
          }
          var brand = saved.brand;
          if (brand && typeof brand.hue === "number" && typeof brand.saturation === "number") {
            var s = Math.max(0, Math.min(100, brand.saturation));
            root.style.setProperty("--sea-h", String(brand.hue));
            root.style.setProperty("--sea-s", s + "%");
            // Una paleta armada trae su degradado y su detalle (ver lib/look).
            root.style.setProperty("--sea-h2", String(typeof brand.hue2 === "number" ? brand.hue2 : (brand.hue + 12) % 360));
            root.style.setProperty("--sea-s2", (typeof brand.saturation2 === "number" ? brand.saturation2 : Math.min(100, s + 10)) + "%");
            root.style.setProperty("--home-leaf", typeof brand.leaf === "string" ? brand.leaf : "hsl(" + brand.hue + " " + Math.min(100, s + 20) + "% 40%)");
          }
          // Los colores propios de la barra y el pie y el estilo por partes, ya resueltos
          // (ver lib/elementColors y lib/look).
          var vars = saved.vars;
          if (vars && typeof vars === "object") {
            for (var name in vars) {
              if (/^--[a-z-]+$/.test(name) && typeof vars[name] === "string") root.style.setProperty(name, vars[name]);
            }
          }
          var attrs = saved.attrs;
          if (attrs && typeof attrs === "object") {
            for (var attr in attrs) {
              if (/^data-look-[a-z]+$/.test(attr) && /^[a-z]+$/.test(attrs[attr])) root.setAttribute(attr, attrs[attr]);
            }
          }
          var fonts = saved.fonts;
          if (Array.isArray(fonts)) {
            fonts.forEach(function (href) {
              if (typeof href !== "string" || href.indexOf("https://fonts.googleapis.com/css2?") !== 0) return;
              var font = document.createElement("link");
              font.rel = "stylesheet";
              font.href = href;
              font.setAttribute("data-look-font", "");
              document.head.appendChild(font);
            });
          }
        } catch (error) {
          /* Sin almacenamiento o con algo roto guardado: se pinta lo de siempre. */
        }
      })();
    </script>
